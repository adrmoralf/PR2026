# Autora: Irene González
# Escenarios de prueba. Cada uno añade obstáculos estáticos y/o personas al restaurante de restaurante.yaml.
# Se elige al lanzar:  ros2 launch restaurante_gazebo restaurante.launch.py escenario:=<nombre>
#
# obstaculos: cajas fijas que NO están en el mapa de SLAM (se mapea con el escenario "vacio").
#   {nombre, x, y, yaw, tamano: [largo, ancho, alto]}
# personas: cilindros de 0.4 m de diámetro y 1.7 m de alto que recorren su ruta en bucle (ida y vuelta).
#   {nombre, velocidad [m/s], pausa [s en cada extremo], ruta: [[x, y], ...]}

escenarios:

  vacio:
    descripcion: "Restaurante sin obstáculos. Úsalo para hacer el mapa con SLAM y para las primeras pruebas."
    obstaculos: []
    personas: []

  obstaculos:
    descripcion: "Objetos fuera de sitio. Todas las mesas siguen siendo alcanzables, pero hay que esquivarlos."
    obstaculos:
      - {nombre: silla_movida, x: 1.3, y:  0.25, yaw: 0.4, tamano: [0.4, 0.4, 0.45]}
      - {nombre: mochila,      x: 3.6, y: -0.3,  yaw: 0.0, tamano: [0.35, 0.25, 0.4]}
      - {nombre: caja,         x: 4.2, y:  0.35, yaw: 0.8, tamano: [0.4, 0.3, 0.3]}
    personas: []

  mesa_bloqueada:
    descripcion: "Un carrito tapa el acceso a la mesa 4. Nav2 debe FALLAR al ir a mesa_4 (prueba de 'objetivo no alcanzable') y llegar bien al resto."
    obstaculos:
      # Ocupa justo el waypoint mesa_4 (4.9, -0.4) y la silla de delante.
      - {nombre: carrito, x: 4.9, y: -0.5, yaw: 0.0, tamano: [1.6, 0.6, 0.9]}
    personas: []

  personas:
    descripcion: "Dos personas: una recorre el pasillo central de frente al robot y otra cruza el pasillo intermedio."
    obstaculos: []
    personas:
      - {nombre: cliente_1, velocidad: 0.6, pausa: 2.0, ruta: [[6.0, 0.1], [1.9, 0.1]]}
      - {nombre: cliente_2, velocidad: 0.8, pausa: 3.0, ruta: [[3.6, 2.6], [3.6, -2.6]]}

  hora_punta:
    descripcion: "Caso difícil: cuatro personas moviéndose y obstáculos estáticos a la vez."
    obstaculos:
      - {nombre: mochila, x: 3.0, y: -0.55, yaw: 0.0, tamano: [0.35, 0.25, 0.4]}
      - {nombre: silla_movida, x: 1.3, y: 0.25, yaw: 0.4, tamano: [0.4, 0.4, 0.45]}
    personas:
      - {nombre: cliente_1, velocidad: 0.6, pausa: 2.0, ruta: [[6.0, 0.35], [1.9, 0.35]]}
      - {nombre: cliente_2, velocidad: 0.8, pausa: 3.0, ruta: [[3.6, 2.6], [3.6, -2.6]]}
      - {nombre: camarero,  velocidad: 1.0, pausa: 1.0, ruta: [[1.9, -0.15], [5.9, -0.15]]}
      - {nombre: cliente_3, velocidad: 0.5, pausa: 4.0, ruta: [[6.1, 2.6], [6.1, -2.6]]}
